<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/zoorup-logo.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="description" content="ZOOR UP - Run Your Business. Turn Customers Into Regulars. Modern billing, QR menus, loyalty rewards, and customer management." />
    <meta name="theme-color" content="#1A2B49" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ZOOR UP" />
    <link rel="apple-touch-icon" href="/zoorup-logo.jpg" />
    <title>ZOOR UP | Run Your Business. Turn Customers Into Regulars.</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            .then((reg) => {
              console.log('[ZOOR UP PWA] Service Worker registered with scope:', reg.scope);
              reg.update().catch(() => {});
            })
            .catch((err) => {
              console.warn('[ZOOR UP PWA] Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
