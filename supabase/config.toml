# Supabase Local & Production Configuration for ZOORUP SaaS Backend
project_id = "igoferpbapfgmybclgyd"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[auth]
enabled = true
port = 54324
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://zoorup.com", "https://*.zoorup.com"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
port = 54323
file_size_limit = "50MiB"

[realtime]
enabled = true
port = 54325
max_header_length = 4096

[studio]
enabled = true
port = 54323

[edge_runtime]
enabled = true
port = 54326
inspector_port = 8083

[analytics]
enabled = false
